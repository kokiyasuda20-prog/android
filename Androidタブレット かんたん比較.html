['s','画面の大きさは?',[['8.5','持ち運びやすい小さめ(8〜9型)'],['10.8','ふつう(10〜11型)'],['12.8','見やすい大画面(12型〜)']]],
['o','YouTubeやGoogle Playのアプリをふつうに使いたい?',[['1','はい(使いたい)'],['0','Amazonのサービス中心でも大丈夫']]],
['e','手書きペンは使う?',[['1','使う'],['0','使わない']]]];
function guide(){return `<h2>質問に答えて選ぶ</h2><p>5つの質問に答えると、おすすめを3つ紹介します。</p><div id="qs">${Q.map(q=>`<fieldset><legend>${q[1]}</legend>${q[2].map((o,i)=>`<label><input type="radio" name="${q[0]}" value="${o[0]}"${i==0?' checked':''}>${o[1]}</label>`).join('')}</fieldset>`).join('')}</div><button class="btn" id="go" style="font-size:1.05rem;padding:10px 22px">おすすめを見る</button><div id="res"></div>`;}
function recommend(){
 const v={};Q.forEach(q=>v[q[0]]=document.querySelector(`input[name=${q[0]}]:checked`).value);
 const bud=+v.b,sz=+v.s;
 const R=P.map(p=>{let s=p.sc[v.u]*10,why=[];
  if(p.sc[v.u]>=3)why.push('使いみちにぴったり');
  if(bud){if(p.pr<=bud){s+=15;why.push('予算内('+p.pt+')')}else s-=Math.min(40,(p.pr-bud)/1000)}
  const d=Math.abs(p.sz-sz);s-=d*5;if(d<1.5)why.push('希望の大きさに近い('+p.sz+'型)');
  if(v.o=='1'&&!p.g)s-=100;
  if(v.e=='1'){s+=p.pen*6;if(p.pen==2)why.push('ペンが付いてくる');else if(p.pen==1)why.push('ペンが使える(別売)')}
  s+=p.ez*2;if(p.ez>=4)why.push('使いやすい');
  return{p,s,why}}).sort((a,b)=>b.s-a.s).slice(0,3);
 document.getElementById('res').innerHTML=`<h2>あなたへのおすすめ</h2>`+R.map((r,i)=>`<div class="card rank"><h3>${i+1}位 ${mkb(r.p)} ${r.p.nm}</h3><p style="margin:4px 0">${r.p.one}</p><p style="margin:4px 0"><b>${r.p.pt}</b> ／ ${r.p.sz}インチ</p><p style="margin:4px 0;color:var(--sub)">おすすめの理由:${r.why.join('、')||'バランスが良い'}</p><a class="btn" href="#/p/${r.p.id}">くわしく見る</a></div>`).join('')+'<p><a href="#/">比較表で見比べる</a></p>';
 document.getElementById('res').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});}
function route(){
 const h=location.hash||'#/',a=document.getElementById('app');
 document.getElementById('n1').className=h=='#/'||h==''?'on':'';document.getElementById('n2').className=h=='#/guide'?'on':'';
 if(h.startsWith('#/p/'))a.innerHTML=detail(h.slice(4));
 else if(h=='#/guide'){a.innerHTML=guide();document.getElementById('go').onclick=recommend}
 else{a.innerHTML=table();document.getElementById('so').onchange=e=>{sortK=e.target.value;route()};a.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{mkF=b.dataset.mk;route()})}
 if(!h.startsWith('#/p/')||1)window.scrollTo(0,0);}
addEventListener('hashchange',route);route();
</script></body></html>
